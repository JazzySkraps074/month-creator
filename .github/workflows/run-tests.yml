name: Run Tests

on: [push]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
    
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Test fixture
        run: |
          if [ "$ {{ matrix.node-version }}" "20.x" ]; then
            echo "FIXTURE=legacy" >> $GITHUB_ENV
          else
            echo "FIXTURE=modern" >> $GITHUB_ENV
          fi
      
      - name: Run tests
        run: npm test
